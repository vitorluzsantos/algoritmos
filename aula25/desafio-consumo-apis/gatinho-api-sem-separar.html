<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title></title>
	</head>
	<body>
		<div class="main-container">
			<div class="container-card">
				<div class="titulo">
					<p>Gatinhos</p>
				</div>
				<div id="cards"></div>
			</div>
		</div>
	</body>
	<style>
body{
	margin: 0;
	padding: 0;
	color: white;
	display: flex;
	justify-content: center;
}

.main-container{
	width: 100%;
	height: 100vh;
	display: flex;
	flex-direction: column;
	background-color: black;
	justify-content: center;
	align-items: center;
}

.container-card{
	border: solid 2px blue;
	height: 70vh;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
}

#cards{
	display: flex;
	justify-content: center;
	width: 90%;
}

.card-gatinho{
	display: flex;
	flex-direction: column;
	width: 50%;
}

.card-gatinho img{
	max-width: 600px;
	max-height: 500px;
}

.titulo{
	font-size: 50px;
	width: 90%;
	display: flex;
	justify-content: center;
}

	</style>
	<script>
buscarGato();

async function buscarGato(){

	let retornoAPI = await fetch(`https://api.thecatapi.com/v1/images/search`);
	let retornoConvertido = await retornoAPI.json();
	let imagemGato = retornoConvertido[0].url
	console.log(retornoConvertido);

	cards.innerHTML += 
	`
<div class="card-gatinho">
<img src="${imagemGato}">
</div>
`
}

</script>
</html>
